<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="saveMoneyLogoTitle">
  <title id="saveMoneyLogoTitle">Save Money</title>
  <defs>
    <linearGradient id="sm-ring" x1="20" y1="10" x2="85" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5CE698"/>
      <stop offset="0.5" stop-color="#22C97A"/>
      <stop offset="1" stop-color="#17ADC2"/>
    </linearGradient>
    <linearGradient id="sm-bars" x1="60" y1="10" x2="82" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7CF2A6"/>
      <stop offset="1" stop-color="#22C97A"/>
    </linearGradient>
  </defs>

  <g transform="translate(0, 10.5)">
    <!-- outer spiral ring -->
    <path d="M 68.81 34.26 A 28 28 0 1 1 34.85 28.28" stroke="url(#sm-ring)" stroke-width="10.5" stroke-linecap="round" fill="none"/>
    <!-- inner spiral curl -->
    <path d="M 28.18 59.92 A 12 12 0 0 1 46.0 51.61" stroke="url(#sm-ring)" stroke-width="7" stroke-linecap="round" fill="none"/>

    <!-- growth bars -->
    <rect x="63" y="17" width="7" height="21" rx="3.5" fill="url(#sm-bars)"/>
    <rect x="74" y="6" width="7" height="32" rx="3.5" fill="url(#sm-bars)"/>

    <!-- mascot face -->
    <rect x="19" y="40" width="50" height="29" rx="14.5" fill="#0F2A2E"/>
    <circle cx="35" cy="54.5" r="4" fill="none" stroke="#3FE0B0" stroke-width="1.6"/>
    <circle cx="53" cy="54.5" r="4" fill="none" stroke="#3FE0B0" stroke-width="1.6"/>
  </g>
</svg>
